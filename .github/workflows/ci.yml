name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  bid2x:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install "pytest>=8.0" "ruff>=0.8" "jsonpickle>=3.0" "google-api-core>=2.0" "google-api-python-client>=2.0" "google-cloud-storage>=2.0"

      - name: Compile bid2x Python sources
        run: python -m compileall -q bid2x

      - name: Lint bid2x with ruff
        run: python -m ruff check bid2x

      - name: Run bid2x smoke tests
        run: python -m pytest
